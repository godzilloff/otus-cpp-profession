name: 'C++ CI'

on:
  push:
    tags:
      - v*
    branches:
      - 'hw6'

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      # Кеширование APT пакетов
      - name: Cache APT packages
        uses: actions/cache@v3
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-apt-
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            build-essential \
            libgtest-dev \
            doxygen graphviz plantuml

      # Локальное кеширование GTest (без системных путей)
      - name: Cache GTest build
        uses: actions/cache@v3
        with:
          path: ~/.local/gtest
          key: ${{ runner.os }}-gtest-${{ hashFiles('**/CMakeLists.txt') }}
      
      - name: Build GTest locally
        run: |
          if [ ! -f "$HOME/.local/gtest/lib/libgtest.a" ]; then
            mkdir -p $HOME/.local/gtest
            cd /usr/src/googletest
            cmake -DCMAKE_INSTALL_PREFIX=$HOME/.local/gtest .
            make
            make install
          fi
      
      # Кеширование сборки проекта
      - name: Cache project build
        uses: actions/cache@v3
        with:
          path: |
            ./hw6/matrix/build
            ./hw6/matrix/CMakeCache.txt
          key: ${{ runner.os }}-build-${{ github.sha }}-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-build-${{ github.sha }}-
            ${{ runner.os }}-build-
      
      - name: Configure CMake
        working-directory: ./hw6/matrix
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DPATCH_VERSION=${{ github.run_number }} \
                -DGTEST_ROOT=$HOME/.local/gtest ..
      
      - name: Build
        working-directory: ./hw6/matrix/build
        run: cmake --build . --parallel
      
      - name: Run tests with XML output
        working-directory: ./hw6/matrix/build
        run: |
          mkdir -p test_results
          ctest --output-on-failure --parallel 4 --output-junit test_results/results.xml
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./hw6/matrix/build/test_results/results.xml
      
      - name: Package
        working-directory: ./hw6/matrix/build
        run: cmake --build . --target package --parallel
      
      - name: Create Release
        run: |
          FILE_PATH="./hw6/matrix/build/matrix-0.6.${{ github.run_number }}-Linux.deb"
          [ ! -f "$FILE_PATH" ] && { echo "Error: File $FILE_PATH not found!"; exit 1; }
          gh release create "v0.6.${{ github.run_number }}" \
            --title "Release v0.6.${{ github.run_number }}" \
            --draft=false \
            --prerelease=false \
            --notes "" \
            "$FILE_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Doxygen HTML
        run: |
          cd hw6/matrix
          mkdir -p docs/html
          sed -i 's|OUTPUT_DIRECTORY\s*=\s*.*|OUTPUT_DIRECTORY = ./docs|' Doxyfile
          sed -i 's|HTML_OUTPUT\s*=\s*.*|HTML_OUTPUT = html|' Doxyfile
          doxygen Doxyfile

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./hw6/matrix/docs/html
          destination_dir: hw6
          keep_files: true
