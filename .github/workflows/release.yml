name: 'C++ CI'

on:
  push:
    tags:
      - v*
    branches:
      - 'hw13'

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential \
            libgtest-dev \
            doxygen graphviz plantuml
      
      - name: Configure CMake
        working-directory: ./hw13
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DPATCH_VERSION=${{ github.run_number }} ..
      
      - name: Build
        working-directory: ./hw13/build
        run: cmake --build . --parallel
      
      - name: Package
        working-directory: ./hw13/build
        run: cmake --build . --target package --parallel
      
      - name: Create Release
        run: |
          FILE_PATH="./hw13/build/fashion-mnist-0.13.${{ github.run_number }}-Linux.deb"
          [ ! -f "$FILE_PATH" ] && { echo "Error: File $FILE_PATH not found!"; exit 1; }
          gh release create "v0.13.${{ github.run_number }}" \
            --title "Release v0.13.${{ github.run_number }}" \
            --draft=false \
            --prerelease=false \
            --notes "" \
            "$FILE_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Doxygen HTML
        run: |
          cd hw13
          mkdir -p docs/html
          sed -i 's|OUTPUT_DIRECTORY\s*=\s*.*|OUTPUT_DIRECTORY = ./docs|' Doxyfile
          sed -i 's|HTML_OUTPUT\s*=\s*.*|HTML_OUTPUT = html|' Doxyfile
          doxygen Doxyfile

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./hw13/docs/html
          destination_dir: hw13
          keep_files: true
