name: 'C++ CI'

on:
  push:
    tags:
      - v*
    branches:
      - 'hw4'

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            doxygen \
            graphviz
      
      - name: Configure CMake
        working-directory: ./hw4/print_ip
        run: cmake . -DPATCH_VERSION=${{ github.run_number }}
      
      - name: Build
        working-directory: ./hw4/print_ip
        run: cmake --build .
      
      - name: Run tests
        working-directory: ./hw4/print_ip
        run: ctest --output-on-failure
      
      - name: Package
        working-directory: ./hw4/print_ip
        run: cmake --build . --target package
      
      - name: Create Release and Upload Asset
        run: |
          FILE_PATH="./hw4/print_ip/print_ip-0.4.${{ github.run_number }}-Linux.deb"
          
          if [ ! -f "$FILE_PATH" ]; then
            echo "Error: File $FILE_PATH not found!"
            exit 1
          fi
          
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --draft=false \
            --prerelease=false \
            --notes "" \
            "$FILE_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Doxygen HTML
        run: |
          cd hw4/print_ip
          mkdir -p docs/html  # create output dir
          # update OUTPUT_DIRECTORY in Doxyfile
          sed -i 's|OUTPUT_DIRECTORY\s*=\s*.*|OUTPUT_DIRECTORY = ./docs|' Doxyfile
          sed -i 's|HTML_OUTPUT\s*=\s*.*|HTML_OUTPUT = html|' Doxyfile
          doxygen Doxyfile
        shell: bash

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./hw4/print_ip/docs/html
          keep_files: false